# XcodeGen project definition — the source of truth for Squarely.xcodeproj.
#
# The generated `Squarely.xcodeproj` (and `Squarely/Info.plist`) are gitignored;
# this YAML is what's version-controlled. Reviewable in diffs, no .pbxproj merge
# conflicts, and every setting is explicit rather than buried in Xcode's UI.
# (It originally also let the project be authored on Windows, where there's no
# Xcode — that's no longer why it's here, but it's a nice property.)
#
# If you'd rather check in a real .xcodeproj: `xcodegen generate`, remove the
# ignore lines in ../.gitignore, drop xcodegen from the Makefile / pre-push hook,
# commit the .xcodeproj, and delete this file.
#
# Setup (one-time): `brew install xcodegen`
# Generate + open:  `cd App && xcodegen generate && open Squarely.xcodeproj`
#                   (or just `make hooks` — `xcodegen generate` runs in the hook)

name: Squarely
options:
  bundleIdPrefix: com.squarely
  deploymentTarget:
    iOS: "17.0"

packages:
  SquareKit:
    path: ../SquareKit

targets:
  Squarely:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Squarely
    dependencies:
      - package: SquareKit
        product: SquareKit
    info:
      path: Squarely/Info.plist
      properties:
        CFBundleDisplayName: Squarely
        UILaunchScreen: {}
        # Development-only deep link scheme, testable in Simulator without a real
        # domain: `xcrun simctl openurl booted "squarely://g/<groupId>"`. Universal
        # Links (`https://<host>/g/:groupId`, DESIGN.md's actual share link) need
        # an Associated Domains entitlement + apple-app-site-association file once
        # a production domain exists — deliberately deferred, not forgotten.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [squarely]
            CFBundleURLName: com.squarely.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.squarely.app
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # For device builds / TestFlight, add: DEVELOPMENT_TEAM: <your Team ID>
        # (or select it in Xcode's Signing & Capabilities tab).

  # App-level unit tests (deep-link parsing, group-not-found handling). Pure
  # XCTest, no Simulator UI — runs anywhere, including `ios-build.yml`.
  SquarelyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SquarelyTests
    dependencies:
      - target: Squarely
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.squarely.app.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Squarely:
    build:
      targets:
        Squarely: all
        SquarelyTests: [test]
    test:
      targets:
        - SquarelyTests
