# XcodeGen project definition — the source of truth for ClanTab.xcodeproj.
#
# The generated `ClanTab.xcodeproj` (and `ClanTab/Info.plist`) are gitignored;
# this YAML is what's version-controlled. Reviewable in diffs, no .pbxproj merge
# conflicts, and every setting is explicit rather than buried in Xcode's UI.
# (It originally also let the project be authored on Windows, where there's no
# Xcode — that's no longer why it's here, but it's a nice property.)
#
# If you'd rather check in a real .xcodeproj: `xcodegen generate`, remove the
# ignore lines in ../.gitignore, drop xcodegen from the Makefile / pre-push hook,
# commit the .xcodeproj, and delete this file.
#
# Setup (one-time): `brew install xcodegen`
# Generate + open:  `cd App && xcodegen generate && open ClanTab.xcodeproj`
#                   (or just `make hooks` — `xcodegen generate` runs in the hook)

name: ClanTab
options:
  bundleIdPrefix: com.clantab
  deploymentTarget:
    iOS: "17.0"

packages:
  ClanTabKit:
    path: ../ClanTabKit

targets:
  ClanTab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClanTab
    dependencies:
      - package: ClanTabKit
        product: ClanTabKit
    info:
      path: ClanTab/Info.plist
      properties:
        CFBundleDisplayName: ClanTab
        # Branded launch screen: the white "=" mark centred on the brand blue
        # (same asset colour as the app icon). Minimal, no text — HIG-compliant,
        # not a splash ad. `LaunchLogo` / `AccentColor` are in Assets.xcassets.
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
          UIColorName: AccentColor
        # The app only talks HTTPS (exempt encryption), so no annual
        # self-classification is needed. Declaring this here skips the
        # export-compliance prompt on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # Development-only deep link scheme, testable in Simulator without a real
        # domain: `xcrun simctl openurl booted "clantab://g/<groupId>"`. Universal
        # Links (`https://<host>/g/:groupId`, DESIGN.md's actual share link) need
        # an Associated Domains entitlement + apple-app-site-association file once
        # a production domain exists — deliberately deferred, not forgotten.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [clantab]
            CFBundleURLName: com.clantab.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clantab.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: UK652GNPP7
        CODE_SIGN_STYLE: Automatic

  # App-level unit tests (deep-link parsing, group-not-found handling). Pure
  # XCTest, no Simulator UI — runs anywhere, including `ios-build.yml`.
  ClanTabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClanTabTests
    dependencies:
      - target: ClanTab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clantab.app.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ClanTab:
    build:
      targets:
        ClanTab: all
        ClanTabTests: [test]
    test:
      targets:
        - ClanTabTests
