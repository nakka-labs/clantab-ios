# XcodeGen project definition — the source of truth for ClanTab.xcodeproj.
#
# The generated `ClanTab.xcodeproj` (and `ClanTab/Info.plist`) are gitignored;
# this YAML is what's version-controlled. Reviewable in diffs, no .pbxproj merge
# conflicts, and every setting is explicit rather than buried in Xcode's UI.
# (It originally also let the project be authored on Windows, where there's no
# Xcode — that's no longer why it's here, but it's a nice property.)
#
# If you'd rather check in a real .xcodeproj: `xcodegen generate`, remove the
# ignore lines in ../.gitignore, drop xcodegen from the Makefile / pre-push hook,
# commit the .xcodeproj, and delete this file.
#
# Setup (one-time): `brew install xcodegen`
# Generate + open:  `cd App && xcodegen generate && open ClanTab.xcodeproj`
#                   (or just `make hooks` — `xcodegen generate` runs in the hook)

name: ClanTab
options:
  bundleIdPrefix: com.clantab
  deploymentTarget:
    iOS: "17.0"

# Project-wide defaults, inherited by every target below unless a target's
# own `settings.base` overrides a key (`PRODUCT_BUNDLE_IDENTIFIER` always
# does). MARKETING_VERSION/CURRENT_PROJECT_VERSION used to be duplicated
# separately in ClanTab's and ClanTabWidgetExtension's own settings blocks —
# a real App Store requirement is that an extension's version matches its
# container app's, and nothing enforced that beyond remembering to bump both
# lines by hand. One value here can't drift.
#
# Bump CURRENT_PROJECT_VERSION with `make bump-build` before every Xcode
# Archive (never by hand — it's arithmetic on a string, easy to fat-finger).
# MARKETING_VERSION is a deliberate version-number decision, not touched by
# that target.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: UK652GNPP7
    CODE_SIGN_STYLE: Automatic

packages:
  ClanTabKit:
    path: ../ClanTabKit

targets:
  ClanTab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClanTab
    dependencies:
      - package: ClanTabKit
        product: ClanTabKit
      - target: ClanTabWidgetExtension
        embed: true
    # Sign in with Apple (ACCOUNTS_DESIGN.md §5) + push notifications
    # (FEATURE_BACKLOG.md). Generated by `xcodegen` and gitignored like
    # Info.plist. All three capabilities must also be enabled on the App ID
    # in the Apple Developer portal before a TestFlight build — push
    # additionally needs an APNs Auth Key generated there and set as the
    # worker's `APNS_*` secrets (`NEXT_STEPS.md` Phase 6's owner action;
    # until then `didRegisterForRemoteNotificationsWithDeviceToken` never
    # fires, which is harmless — everything else in the app works
    # unaffected). App Groups is the one exception that's *not* fully
    # blocked on the portal: Xcode's automatic signing can create the group
    # id itself for a local/Simulator build.
    # `aps-environment: development` matches a local Xcode build's sandbox
    # device tokens; Xcode rewrites it to `production` automatically for an
    # Archive build, same as automatic signing handles provisioning.
    entitlements:
      path: ClanTab/ClanTab.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.clantab.app
    info:
      path: ClanTab/Info.plist
      properties:
        CFBundleDisplayName: ClanTab
        # Reference the build settings so a version bump is a one-line change in
        # `settings.base` below — never a frozen literal in the generated plist.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Branded launch screen: the white "=" mark centred on the brand blue
        # (same asset colour as the app icon). Minimal, no text — HIG-compliant,
        # not a splash ad. `LaunchLogo` / `AccentColor` are in Assets.xcassets.
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
          UIColorName: AccentColor
        # The app only talks HTTPS (exempt encryption), so no annual
        # self-classification is needed. Declaring this here skips the
        # export-compliance prompt on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # Development-only deep link scheme, testable in Simulator without a real
        # domain: `xcrun simctl openurl booted "clantab://g/<groupId>"`. Universal
        # Links (`https://<host>/g/:groupId`, DESIGN.md's actual share link) need
        # an Associated Domains entitlement + apple-app-site-association file once
        # a production domain exists — deliberately deferred, not forgotten.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [clantab]
            CFBundleURLName: com.clantab.app
          # Google Sign-In redirect (MANDATORY_LOGIN_PLAN.md Part 1) — the
          # reversed form of AppConfig.googleClientID. Required for
          # ASWebAuthenticationSession's callback; no Google SDK involved.
          - CFBundleURLSchemes: [com.googleusercontent.apps.785063933196-ieaukpoat5r6v5jjr65315o9rniaaahn]
            CFBundleURLName: com.clantab.app.google
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clantab.app
        # iPhone only. Doesn't hoist to the project-wide settings above —
        # xcodegen silently widens it back to "1,2" (universal) there,
        # apparently applying its own per-target iOS default *after* project
        # settings but before target settings, so it has to live here.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Home-screen widget (`FEATURE_BACKLOG.md`) — glanceable "you owe / you're
  # owed" for the most-recently-opened group. Reads a snapshot the app
  # writes on every refetch (`GroupViewModel.updateWidgetSnapshot`,
  # `ClanTabKit`'s `WidgetSnapshotStoring`) from the shared App Group
  # container; makes no network calls of its own ("lightweight refresh
  # path").
  ClanTabWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClanTabWidget
      # Shared with the ClanTab target — the extension's only channel for
      # AppConfig.appGroupID/sharedDefaults/balanceWidgetKind.
      - path: ClanTab/AppConfig.swift
    dependencies:
      - package: ClanTabKit
        product: ClanTabKit
    entitlements:
      path: ClanTabWidget/ClanTabWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.clantab.app
    info:
      path: ClanTabWidget/Info.plist
      properties:
        CFBundleDisplayName: ClanTab Balance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clantab.app.widget
        TARGETED_DEVICE_FAMILY: "1" # see ClanTab's own settings comment
        SKIP_INSTALL: "YES"

  # App-level unit tests (deep-link parsing, group-not-found handling). Pure
  # XCTest, no Simulator UI — runs anywhere, including `ios-build.yml`.
  ClanTabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClanTabTests
    dependencies:
      - target: ClanTab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clantab.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ClanTab:
    build:
      targets:
        ClanTab: all
        ClanTabWidgetExtension: all
        ClanTabTests: [test]
    test:
      targets:
        - ClanTabTests
