name: iOS App Build Check

# Verifies App/ compiles and its unit tests pass, using a macOS GitHub Actions
# runner - the only way to build Swift/SwiftUI for iOS, since there's no macOS
# available in local development for this repo (see App/README.md). Simulator
# only: no code signing needed, no device required.

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "App/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd App && xcodegen generate

      - name: Show generated schemes (debugging aid)
        run: cd App && xcodebuild -list -project Squarely.xcodeproj

      - name: Build for iOS Simulator
        run: |
          cd App
          xcodebuild build \
            -project Squarely.xcodeproj \
            -scheme Squarely \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run App unit tests (SquarelyTests)
        run: |
          cd App
          # Pick whatever iPhone simulator the runner actually has, so this
          # doesn't break when GitHub bumps the default device name.
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E 'iPhone' \
            | grep -Eo '[0-9A-Fa-f-]{36}' | head -1)
          echo "Using simulator $DEVICE_ID"
          xcodebuild test \
            -project Squarely.xcodeproj \
            -scheme Squarely \
            -configuration Debug \
            -only-testing:SquarelyTests \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
