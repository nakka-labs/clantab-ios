name: Publish site (privacy + support)

# Publishes two pages on GitHub Pages, for the URLs App Store Connect requires:
#   /              ← docs/privacy-policy.md   (Privacy Policy URL — unchanged)
#   /support.html  ← docs/support.html        (Support URL)
# Nothing else in docs/ (App Store copy, screenshots, branding) is published.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The site URL is then https://nakka-labs.github.io/clantab-ios/
# (shown on the deploy job once it runs).

on:
  push:
    branches: [main]
    paths:
      - docs/privacy-policy.md
      - docs/support.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let queued ones wait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the privacy policy (root) and the support page
        run: |
          mkdir -p _site_src
          {
            echo '---'
            echo 'title: ClanTab Privacy Policy'
            echo '---'
            cat docs/privacy-policy.md
          } > _site_src/index.md
          # support.html is a complete standalone document — copy it verbatim,
          # with front matter telling Jekyll not to wrap it in a layout.
          {
            echo '---'
            echo 'layout: null'
            echo '---'
            cat docs/support.html
          } > _site_src/support.html
          cat > _site_src/_config.yml <<'YAML'
          title: ClanTab
          theme: jekyll-theme-primer
          YAML

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
