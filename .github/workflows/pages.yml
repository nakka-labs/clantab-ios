name: Publish privacy policy

# Publishes docs/privacy-policy.md as a standalone page on GitHub Pages, for the
# URL App Store Connect requires. Only that one file is published — the rest of
# docs/ (App Store copy, screenshots) stays out of the site.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The site URL is then https://nakka-labs.github.io/clantab-ios/
# (shown on the deploy job once it runs).

on:
  push:
    branches: [main]
    paths:
      - docs/privacy-policy.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let queued ones wait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the privacy policy as the site root
        run: |
          mkdir -p _site_src
          {
            echo '---'
            echo 'title: ClanTab Privacy Policy'
            echo '---'
            cat docs/privacy-policy.md
          } > _site_src/index.md
          cat > _site_src/_config.yml <<'YAML'
          title: ClanTab Privacy Policy
          theme: jekyll-theme-primer
          YAML

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
