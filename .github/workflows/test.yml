name: SquareKit Tests

# Runs on every push/PR (no path filter): the suite includes GoldenParityTests,
# which reads test-fixtures/ — the same vectors the Worker's logic tests use, so
# a fixture change must exercise this job too.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run SquareKit Tests
        run: swift test --package-path SquareKit
